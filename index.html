  const pur=[];if(R.pk[op].kn)pur.push(PV("theirs",pnames(R.pk[op].bt)));if(R.pk[me].kn)pur.push(PV("yours",pnames(R.pk[me].bt)));

function pdfText(root){
 const out=[],SKIP=/^(SVG|STYLE|SCRIPT|SELECT|INPUT|TEXTAREA|BUTTON)$/,INL=/^(SPAN|A|B|I|EM|STRONG|CODE|SMALL|BR)$/;
 const clean=s=>s.replace(/\s+/g," ").trim(),push=(s,o)=>{s=clean(s);if(s)out.push(Object.assign({s},o))};
 function table(t,ind){
  const rows=[...t.rows].map(r=>[...r.cells].map(c=>({s:clean([...c.childNodes].map(x=>x.textContent).join(" ")),r:c.classList.contains("r")})));if(!rows.length)return;
  const n=Math.max(...rows.map(r=>r.length)),w=Array(n).fill(0);
  rows.forEach(r=>r.forEach((c,i)=>w[i]=Math.max(w[i],c.s.length)));
  const cap=Math.max(8,Math.floor((150-ind-3*(n-1))/n));
  for(let i=0;i<n;i++)w[i]=Math.min(w[i],i<2?Math.max(cap,26):cap);
  const fit=(c,i)=>{let s=c.s.length>w[i]?c.s.slice(0,w[i]-2)+"..":c.s;return c.r?s.padStart(w[i]):s.padEnd(w[i])};
  rows.forEach((r,ri)=>{const l=r.map((c,i)=>fit(c,i)).join(" | ").replace(/\s+$/,"");out.push({s:l,ind,b:ri===0,mono:1});if(ri===0)out.push({s:"-".repeat(Math.min(150,l.length)),ind,mono:1})});out.push({s:"",gap:1})}
 function kids(n,ind){let buf="",pe=false;const fl=()=>{push(buf,{ind});buf="";pe=false};
  for(const c of n.childNodes){
   if(c.nodeType===3){buf+=c.textContent;pe=false}
   else if(c.nodeType===1&&INL.test(c.tagName)&&!SKIP.test(c.tagName.toUpperCase())){buf+=(pe?" ":"")+c.textContent;pe=true}
   else{fl();walk(c,ind)}}
  fl()}
 function walk(n,ind){
  if(n.nodeType!==1||n.hidden)return;const tag=n.tagName.toUpperCase();if(SKIP.test(tag))return;
  if(tag==="TABLE"){table(n,ind);return}
  if(/^H[1-3]$/.test(tag)){out.push({s:"",gap:1});push(n.textContent,{h:tag==="H2"||tag==="H1"?1:2,ind});return}
  const cl=n.classList;
  if(cl.contains("line")){const pill=n.querySelector(".pill"),d=n.children[1];if(!d)return;const c=d.cloneNode(true);c.querySelectorAll(".battle").forEach(x=>x.remove());
   push("["+clean((pill?pill.textContent:"").replace(/[▴▾]/g,""))+"] "+c.textContent,{ind});const b=d.querySelector(".battle");if(b){out.push({s:"",gap:1});walk(b,ind+4);out.push({s:"",gap:1})}return}
  if(cl.contains("att")){const t=n.querySelector(".t");push("* "+(t?t.textContent:n.textContent),{ind});return}
  if(cl.contains("stat")){push([...n.children].map(c=>c.textContent).join(" "),{ind});return}
  if(cl.contains("bt-h")){push(n.textContent,{h:2,ind});return}
  kids(n,ind)}
 kids(root,0);return out}
function pdfWrap(lines,max){const o=[];
 for(const L of lines){const ind=L.ind||0,w=max-ind;
  if(L.mono||L.s.length<=w){o.push(Object.assign({},L,{s:L.s.slice(0,max)}));continue}
  let rest=L.s,first=true;while(rest.length>w){let k=rest.lastIndexOf(" ",w);if(k<w*.4)k=w;o.push(Object.assign({},L,{s:rest.slice(0,k).trimEnd(),ind:ind+(first?0:2),h:first?L.h:0}));rest=rest.slice(k).trimStart();first=false}
  o.push(Object.assign({},L,{s:rest,ind:ind+(first?0:2),h:first?L.h:0}))}
 return o}
function buildPdf(sections,head){
 const W=841.89,H=595.28,ML=36,CW=4.8,SZ=8,pages=[];
 let cur=null,y=0;const np=()=>{cur=[];pages.push(cur);y=H-52},lh=l=>l.gap?5:l.h===1?17:l.h===2?13:10.5;
 for(const sec of sections){np();
  cur.push({s:sec.title.toUpperCase(),x:ML,y,b:1,sz:14});y-=20;
  for(const l of pdfWrap(sec.lines,Math.floor((W-2*ML)/CW))){const h=lh(l);if(y-h<40){np()}
   if(l.gap&&y>H-52-1)continue;y-=h;if(l.gap)continue;
   cur.push({s:l.s,x:ML+(l.ind||0)*CW,y:y+2,b:l.b||l.h,sz:l.h===1?11:l.h===2?9:SZ})}}
 const N=pages.length,objs=[];
 objs[1]="<< /Type /Catalog /Pages 2 0 R >>";
 objs[2]=`<< /Type /Pages /Kids [${pages.map((p,i)=>`${6+2*i} 0 R`).join(" ")}] /Count ${N} >>`;
 objs[3]="<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>";
 objs[4]="<< /Type /Font /Subtype /Type1 /BaseFont /Courier-Bold /Encoding /WinAnsiEncoding >>";
 pages.forEach((p,i)=>{
  let c=`0.45 g BT /F1 7 Tf 1 0 0 1 ${ML} ${H-26} Tm (${pEsc(head)}) Tj ET BT /F1 7 Tf 1 0 0 1 ${W-ML-60} 22 Tm (Page ${i+1} of ${N}) Tj ET 0 g\n`;
  for(const t of p)c+=`BT /F${t.b?2:1} ${t.sz} Tf 1 0 0 1 ${t.x.toFixed(1)} ${t.y.toFixed(1)} Tm (${pEsc(t.s)}) Tj ET\n`;
  objs[5+2*i]=`<< /Length ${c.length} >>\nstream\n${c}endstream`;
  objs[6+2*i]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${5+2*i} 0 R >>`});
 let s="%PDF-1.4\n";const off=[];
 for(let i=1;i<objs.length;i++){off[i]=s.length;s+=`${i} 0 obj\n${objs[i]}\nendobj\n`}
 const x=s.length;s+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`+off.slice(1).map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
 const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;return new Blob([u],{type:"application/pdf"})}
async function exportPdf(){

   UI.tab=t;
   if(t==="report"){UI.filter="all";const R=G.reports,r=R[UI.rep==null?R.length-1:UI.rep];r.events.forEach((e,i)=>{if(e.battle)UI.open[r.turn+":"+i]=true})}
   ({report:renderReport,realm:renderRealm,standing:renderStanding})[t]();
   secs.push({title,lines:pdfText($("#main"))})}
 }finally{Object.assign(UI,sv);renderAll()}
 const R=G.reports,r=R[sv.rep==null?R.length-1:sv.rep],head=`King of Demons - Game No. ${G.no}v${GAME_VERSION} - ${G.players[0].name} - Turn ${G.turn} - Report shown: ${r.turn?"Turn "+r.turn:"Opening briefing"}`;
 const blob=buildPdf(secs,head),b2=$("#pdfbtn");

function plainSave({filename,data}){return new Promise((ok,no)=>{try{const u=URL.createObjectURL(data),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);ok({status:"saved"})}catch(e){no({code:"unavailable"})}})}
/* Inside claude.ai the page gets a sandboxed save step. On any other host (own site, local file) a normal browser download is used. */

 else{DL={save:plainSave};renderHeader()}}catch(e){}}

/* ===== TUTORIALS: short animated slide shows that run on the REAL screens, using a sandboxed demo game =====
   The demo game never touches the player's game: withDemo() swaps G (and map size, seat, UI.open) in and out,
   and save() refuses to write while DEMO_ON is true. Each slide re-renders a real tab (renderOrders, ...) into the stage,
   then a spotlight ring, a moving cursor and a one-line caption explain it. No sound. */
let DEMO=null,DEMO_ON=false;
const T={show:null,i:0,playing:true,done:false,tok:0,timers:[],adv:null,open:{},hid:null};
function demoBuild(){/* a throwaway game with a fixed seed; the real G and map size are put back afterwards */
 const rg=G,nx=NX,ny=NY,rme=ME;
 try{newGame({seed:20260});DEMO=G;DEMO.askName=false}finally{G=rg;ME=rme;setDims(nx,ny)}
 return DEMO}
function withDemo(fn){
 if(!DEMO)demoBuild();
 const rg=G,nx=NX,ny=NY,rme=ME,ro=UI.open,rs=UI.sel,rt=UI.tab,rf=UI.filter;
 G=DEMO;DEMO_ON=true;setDims(DEMO.cfg.nx,DEMO.cfg.ny);ME=0;UI.open=T.open;UI.filter="all";
 try{return fn(G)}finally{G=rg;DEMO_ON=false;setDims(nx,ny);ME=rme;UI.open=ro;UI.sel=rs;UI.tab=rt;UI.filter=rf}}
function demoReset(show){
 DEMO=null;T.open={};T.sel=null;demoBuild();
 withDemo(g=>{T.hid=hordesOf(0)[0].id;if(show&&show.init)show.init(g,hordesOf(0)[0])})}
function demoRun(fn){withDemo(g=>fn(g,hordesOf(0)[0]))}

 try{withDemo(()=>{UI.tab=tab;UI.sel=T.sel||null;({orders:renderOrders,realm:renderRealm,standing:renderStanding,report:renderReport})[tab]()})}
 finally{pg.id="tpage";real.id="main"}

 tutClear();T.tok++;T.show=null;T.shown=false;
 $("#main").innerHTML=`<h2>Tutorials</h2><p class="sub">Short animated walkthroughs of the real game screens. No sound, and almost no reading. Pick one to watch, and pause or step through it whenever you like.</p>

 <p class="note" style="margin-top:14px">Nothing here touches your game: the screens come from a practice game that is thrown away afterwards.</p>`}
document.addEventListener("click",e=>{
 const b=e.target.closest&&e.target.closest("[data-tut]");if(!b||!$("#main"))return;
 const a=b.dataset.tut;
 if(a==="open")tutOpen(b.dataset.id);
 else if(a==="topics"){const l=b.nextElementSibling,o=l.hidden;l.hidden=!o;b.setAttribute("aria-expanded",String(o));b.textContent="Topics Covered "+(o?"▾":"▸")}
 else if(a==="all")tutOpen(TUTS[0].id,true);
 else if(a==="menu")renderTutorials();
 else if(a==="play"){T.playing?tutPause():tutResume()}
 else if(a==="prev"&&T.i>0){const p=T.playing;tutGo(T.i-1);if(!p){tutPause()}}
 else if(a==="next"&&T.show&&T.i<T.show.steps.length-1){const p=T.playing;tutGo(T.i+1);if(!p){tutPause()}}
 else if(a==="dot"){const p=T.playing;tutGo(+b.dataset.i);if(!p){tutPause()}}});
let tutRz=null;window.addEventListener("resize",()=>{if(!T.show||!$("#tstage"))return;clearTimeout(tutRz);tutRz=setTimeout(()=>{const p=T.playing;T.shown=false;tutGo(T.i);if(!p)tutPause()},300)});

const CH={DISCIPLINE:"Beat the horde into line. Sacrifices a tenth of its demons or more (at least one; the worse the mood, the more), eases its Mindless Rage and makes the general harder to defy. It is always obeyed, though a Mutinous horde may defy its effect, and it does nothing unless the horde is already at least Discontent. Rage is felt only away from your home plane.",HOLD:"Stay put and fight anything that comes. A force that holds fights with +25% strength when an enemy moves in to attack it (+15% without the order).",DOMINATE:"Travel toward a plane and fight whatever you meet. Planes you hold cost half a move to cross; all others cost a full move. The horde stops and fights at the first hostile plane.",RAID:"Slip into a plane held by another prince, siphon part of its yield for the turn, and withdraw the same turn. You keep 20% of what a full raid would take; the holder loses 40%. Fights any horde there first and skips the planar defenses. Costs a few demons. Lasts one turn.",MARCH:"Like MOVE and DOMINATE, but the horde gets 2 more moves. Its strength is cut 25% in rounds 1 to 3 of every fight it fights after marching.",SUMMON:"Pay souls to add demons. They join the horde at the start of the turn and fight this turn. Not allowed while an enemy horde is on the horde's plane at the start of the turn.",DISBAND:"Dissolve this horde and its general for good. You recover 10% of the demons' cost, and the general slot is free to UNLEASH GENERAL again as any type."};
const PCH={FOMENT:"FOMENT CHAOS",UNLEASH:"UNLEASH GENERAL",SCRY:"SCRY",FORGE:"BLOOD PACT",BREAK:"BREAK PACT"};
function calcPlan(){
 const P=G.players[0],tier=effTier(0),errs=[],warns=[];let hc=0,pc=0,unl=0;
 for(const h of hordesOf(0)){const c=h.cmd;
  if(c.type==="SUMMON"&&enemyHere(h.loc,0))errs.push(`${h.gen}: SUMMON is not allowed while an enemy horde is on its plane (${h.loc}) at the start of the turn. Give it another order.`);if(c.type==="SUMMON"){const n=cleanN(c.n,tier,h.cls);hc+=sumH(n,h);if(!sumN(n))warns.push(`${h.gen} has SUMMON with no demons chosen.`)}
  if(c.type==="RAID"&&G.planes[c.target]&&raidBarred(c.target))errs.push(`${h.gen}: RAID needs a plane held by another prince, and ${c.target} is not one you know of.`);if((c.type==="DOMINATE"||c.type==="MARCH"||c.type==="RAID")&&!G.planes[c.target])errs.push(`${h.gen} needs a target plane.`);}
 if(P.shadowCmd&&(P.shadowCmd.type==="SSUMMON"||P.shadowCmd.type==="SUMMON"))hc+=sumN(cleanN(P.shadowCmd.n,tier,"F"));
 for(const c of P.princely){if(!c.type)continue;if(c.type==="UNLEASH"){pc+=UNLEASH;unl++}else if(c.type==="BREAK"){pc+=BREAKC;if(!activeBonds(P.id).length)errs.push("BREAK PACT needs an active Blood Pact to break.")}else if(c.type==="FORGE"){c.souls=forgeCost(G.turn);pc+=c.souls;if(!(P.met||[]).includes(c.target))errs.push(P.met.length?"BLOOD PACT needs a rival prince you have met.":"BLOOD PACT needs a prince you have met, and you have not met anyone yet.");else if(isAI(c.target)&&!G.players[c.target].open)errs.push(`${G.players[c.target].name} is not open to a Blood Pact this turn.`);else if(pactBusy(P.id,c.target))errs.push("You are already bound by a Blood Pact to another prince. A prince may have only one at a time.")}else {const q=Math.max(0,Math.floor(c.souls||0));pc+=q;if(c.type==="SCRY"&&(q<SCRYU||q>SCRYMAX||q%SCRYU))errs.push(`SCRY costs ${fmt0(SCRYU)} souls per extra hop: enter ${fmt0(SCRYU)}, ${fmt0(SCRYU*2)} or ${fmt0(SCRYMAX)}, no more.`)}}
 if(P.rank>=10&&P.princely.some(c=>c.type==="FOMENT"))errs.push("FOMENT CHAOS is not allowed: you are already a Prince of Demons, the highest chaos power rank. Choose another command.");if(unl&&!ownsHome(0))errs.push("UNLEASH GENERAL needs a home plane. You no longer hold yours, so you cannot unleash new generals.");else if(hordesOf(0).length-hordesOf(0).filter(x=>x.cmd.type==="DISBAND").length+unl>capOf(0))errs.push(P.rank<10?`YOU CANNOT UNLEASH ANOTHER GENERAL UNTIL YOU ACHIEVE A HIGHER CHAOS POWER RANK WITH THE FOMENT CHAOS COMMAND. You have ${hordesOf(0).length} of ${capOf(0)} generals. Disbanding a general also frees a slot. A rank gained this turn only applies to your orders next turn.`:`YOU CANNOT UNLEASH ANOTHER GENERAL: you have ${hordesOf(0).length} of ${capOf(0)} and are at the highest Chaos Power rank. Disbanding a general frees a slot.`);
 const rem=P.well-hc-pc;if(rem<0)errs.push(`Over budget by ${fmt0(-rem)} souls.`);
 return{hc,pc,rem,errs,warns,unl}}
/* Summoning offers only the highest tier your rank allows, in the horde's class: strength per soul is the same at every tier, and higher tiers carry purge and shrug off lower purge. */
const topKind=(tier,cls)=>DK.filter(k=>DT[k].t<=tier&&DT[k].c===cls).slice(-1);

function qtyUI(hid,types,n,summon,have){

function targetUI(h){
 const K=G.players[0].known,d=distMap(h.loc),s=hstats(h),t=h.cmd.target;
 const ids=Object.keys(K).filter(id=>id!==h.loc||h.cmd.type==="DOMINATE"||h.cmd.type==="MARCH").sort(idCmp);
 const opts=`<option value="">Choose a plane…</option>`+ids.map(id=>{const k=K[id];const lab=k.full?`${id} · ${k.np||(k.o!=null&&k.o>=0?(k.o===0?"yours":short(k.o)):"unheld")} · dom ${k.d} · value ${k.q}`:`${id} · unexplored`;return`<option value="${id}" ${t===id?"selected":""} ${(h.cmd.type==="RAID"&&raidBarred(id))?"disabled":""}>${lab} · ${d[id]} away</option>`}).join("");
 let info="";
 if(G.planes[t]){const pth=route(h.loc,t,h.owner),len=pth.length,hops=mvBudget(h),nt=turnsFor(h,pth),k=K[t];
  info=t===h.loc?(G.planes[t].owner===h.owner?`Your horde is already on this plane. It will fight any enemy horde that is here. `:`Your horde is already on this plane. DOMINATE keeps it fighting the enemy hordes and planar defenses here until you hold the plane. `):`${len} plane${len===1?"":"s"} away. This horde has ${hops} move${hops===1?"":"s"} a turn${h.cmd.type==="MARCH"?" (forced march, +2)":""}; planes you hold cost half.${h.cmd.type==="RAID"?(nt>1?" RAID only works if the horde arrives this turn: this target is out of reach.":" It raids on arrival and withdraws the same turn."):` <b>Estimated turns to complete: ${nt}.</b>`}`;
  if(k&&k.full){const od=h.cmd.type!=="RAID"&&k.o!==0?oddsFor(h,t,K):null,pd=od&&od.prince?` You will also need to fight the plane's defenses and the owner's Shadow Horde. Accurate estimates are impossible, but these defenses might have a strength of ~${fmt0(od.def)}.`:(h.cmd.type==="RAID"&&k.o!=null&&k.o>0?` Planar defense strength ${DOM[k.d].o+DOM[k.d].d}.`:"");const eh=(k.h||[]).filter(x=>x.o!==0).map(x=>` Enemy horde seen, strength ${x.p==null?"unknown":"~"+fmt0(x.p)}.`).join("");info+=` Last seen ${ageLabel(k.t)}.${k.np?` Held by ${k.np}, strength unknown.`:""}${pd}${h.cmd.type==="RAID"&&pd?" Any Shadow Horde adds to that.":""}${eh} Your horde: strength ~${fmt0(s.str)}.${od?(od.unknown?" Some of the defenders are hidden, so no odds can be given.":` We tortured an oracle and determined that your omens of victory are <b>${{low:"unfavorable",medium:"uncertain",high:"favorable"}[od.level]}</b>. Remember, ${od.level==="low"?"fortune can favor the reckless":"bad luck can ruin the best odds"}.`):""}`}
  else info+=" You have only its name. Expect the unknown."}
 return`<div class="cmdrow"><select data-k="tgt" data-h="${h.id}" aria-label="Target plane">${opts}</select></div>${info?`<div class="note">${info}</div>`:""}`}
function mvTxt(h){return`<b>${Math.round((hstats(h).mv+lashB(h))*100)/100}</b>`}
function dLine(h){const pd=h.pd,ks=Object.keys(h.demons);if(pd)for(const k in pd)if(!(k in h.demons)&&DT[k])ks.push(k);

 return`<div class="card hc" id="hc-${h.id}"><div class="top"><span class="gen">Horde ${hno(h)} · ${h.gen} <button class="pill s-good" data-act="gdet" data-id="${h.id}" aria-expanded="${!!UI.open["gd"+h.id]}" title="Age, Experience and Resurrections">Details ${UI.open["gd"+h.id]?"▴":"▾"}</button></span><span class="kv"><span>at <a class="ref" role="button" tabindex="0" data-act="plane" data-id="${h.loc}">${h.loc}</a></span></span></div>

 <div class="dem">${empty?`<span>No demons. Summon some.</span>`:dLine(h)}</div>

const ICO={swords:'<g transform="translate(12 12) scale(1.12) translate(-12 -12) translate(0 2.6)"><g transform="rotate(43 12 8)"><path class="f" d="M10.300 5.500L12.800 -1.200L13.700 5.500V18.500Q13.700 20.500 12 20.500Q10.300 20.500 10.300 18.500Z"/><rect class="f" x="7.600" y="14.200" width="8.800" height="1.800" rx=".9"/></g><g transform="rotate(-43 12 8)"><path class="f" d="M10.300 5.500L12.800 -1.200L13.700 5.500V18.500Q13.700 20.500 12 20.500Q10.300 20.500 10.300 18.500Z"/><rect class="f" x="7.600" y="14.200" width="8.800" height="1.800" rx=".9"/></g></g>',mtn:'<path d="M2 20l7-13 4 7 3-4 6 10z"/><path d="M7 11l2 2 2-2"/><path d="M16 10l1.5 2"/>',skull:'<path class="f" fill-rule="evenodd" d="M8.2 5.8C10 5 14 5 15.8 5.8L17 8.5 19.3 9.5V14.2L17.5 16.5 16.8 17.2 16.5 20.5 14.8 19.8 13.5 21 12 20 10.5 21 9.2 19.8 7.5 20.5 7.2 17.2 6.5 16.5 4.7 14.2V9.5L7 8.5zM6.6 10.6L11 12.2 10.2 13.9 7.3 12.7zM17.4 10.6L13 12.2 13.8 13.9 16.7 12.7zM12 14.2l1.1 2H10.9z"/><path class="f" d="M4.8 1.5L8.4 7.2 5.4 9z"/><path class="f" d="M19.2 1.5L15.6 7.2 18.6 9z"/><path d="M9.6 18v2.6M11.2 18.2v2.6M12.8 18.2v2.6M14.4 18v2.6" stroke="#150b0e" stroke-width=".9"/>',blast:'<g transform="translate(-.5 3.5) scale(.66)" stroke-width="2.4"><path d="M12 1l2.2 5.3L19 3.5l-1.3 5.6L23 9l-4 3.8L22 18l-5.7-1L14 22l-2-4.5L10 22l-2.3-5L2 18l3-5.2L1 9l5.3.1L5 3.5l4.8 2.8z"/></g><g transform="translate(11.5 -.5) scale(.46)" stroke-width="3.4"><path d="M12 1l2.2 5.3L19 3.5l-1.3 5.6L23 9l-4 3.8L22 18l-5.7-1L14 22l-2-4.5L10 22l-2.3-5L2 18l3-5.2L1 9l5.3.1L5 3.5l4.8 2.8z"/></g><g transform="translate(13.5 13) scale(.38)" stroke-width="4"><path d="M12 1l2.2 5.3L19 3.5l-1.3 5.6L23 9l-4 3.8L22 18l-5.7-1L14 22l-2-4.5L10 22l-2.3-5L2 18l3-5.2L1 9l5.3.1L5 3.5l4.8 2.8z"/></g>',dom:'<g transform="translate(12 12) rotate(45) scale(1.3) translate(-12 -12)"><path d="M12 2l2.5 3.5V15h-5V5.5z"/><path d="M7 15h10M12 15v4"/><circle cx="12" cy="20.8" r="1.4"/></g>',val:'<path d="M6 4h12l4 6-10 11L2 10z"/><path d="M2 10h20M9 4l-2 6 5 11 5-11-2-6"/>',soul:'<path d="M12 2c1 5 6 7 6 13a6 6 0 0 1-12 0c0-3 1.5-4.5 3-6 .5 2 1 3 2 3 1-2 1-6 1-10z"/>',hor:'<path d="M7 10C4 9 3.5 5 5 2.5M17 10c3-1 3.5-5 2-7.5"/><path d="M7 10h10v5a5 5 0 0 1-10 0z"/><circle class="f" cx="9.6" cy="13.5" r="1"/><circle class="f" cx="14.4" cy="13.5" r="1"/>',sh:'<g stroke-dasharray="2.2 2.4"><path d="M7 10C4 9 3.5 5 5 2.5M17 10c3-1 3.5-5 2-7.5"/><path d="M7 10h10v5a5 5 0 0 1-10 0z"/></g><circle class="f" cx="9.6" cy="13.5" r="1"/><circle class="f" cx="14.4" cy="13.5" r="1"/>',pl:'<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/><circle cx="12" cy="11" r="3"/>'};
const icn=(k,sz)=>`<svg class="ic ic-${k}" width="${sz||16}" height="${sz||16}" viewBox="0 0 24 24" aria-hidden="true">${ICO[k]}</svg>`;
const mapIc=(k,x,y,c)=>`<g ${tipA(k)} style="cursor:help"><rect x="${x-2}" y="${y-2}" width="26" height="15" fill="transparent"/><svg x="${x}" y="${y}" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICO[k].replace(/class="f"/g,`fill="${c}" stroke="none"`)}</svg></g>`;
const icL={dom:"Domination Level",val:"Value",soul:"Souls per turn",hor:"Horde Strength",sh:"Shadow Horde Strength",pl:"Planar Defense Strength"};
const icD={dom:"How firmly the plane is held, 0 to 6. Each win cuts it by 2.",val:"What the plane can yield, 0 to 7. Fixed for the whole game.",soul:"Souls the plane gives your Well each turn.",hor:"Strength of the hordes you last saw on the plane.",sh:"The holder's Shadow Horde that also defends the plane.",pl:"The plane's own defense, set by its Domination Level."};
const tipA=k=>`data-tip="${icL[k]}" data-tipd="${icD[k]}"`;
const icTh=k=>`<th class="r ith" ${tipA(k)} aria-label="${icL[k]}">${icn(k,20)}</th>`;
function hordeOf(id,k){const h=hordeInfo(id,k);return h.n?`~${fmt0(h.n)}${h.u?"+?":""}`:h.u?"?":"–"}
function shadowOf(id,k){const n=shNum(id,k);return n==null?"–":n?`~${fmt0(n)}`:"0"}
function planarOf(id,k){const n=pdNum(id,k);return n==null?"–":fmt0(n)}
const dsm=(n,mine)=>n?`<span class="d ${mine?(n>0?"up":"dn"):"eq"}"> ${n>0?"▲":"▼"}${fmt0(Math.abs(n))}</span>`:"";
function renderRealm(){
 const K=G.players[0].known;
 let h=`<h2>The Abyss</h2><p class="sub">Dashed outlines are stale or unexplored. Select a plane to read it and send a horde. The map wraps at every edge.</p>`;
 h+=`<div class="mapbox">${mapSVG()}</div><div class="legend">${G.players.map((p,i)=>`<span><i style="background:var(--c${i})"></i>${i?short(i):"You"}</span>`).join("")}<span><i style="background:var(--cn)"></i>Minor Power</span><span>${icn("dom",13)} Domination Level · ${icn("val",13)} plane value · H = your hordes · ! = Minor Horde · numbered circle = a prince's horde, in that prince's color.<br>Solid and dotted red lines indicate a connection between planes that hordes can move through.</span></div>`;
 h+=`<div class="sec">${UI.sel?`<div id="pdetail">${planeDetail(UI.sel)}</div>`:`<div class="card"><h3>Plane</h3><div class="note">Select a plane on the map.</div></div>`}</div>`;
 const live=id=>{const pl=G.planes[id];return pl.owner===0?Object.assign({},K[id],{o:0,d:pl.dom,q:pl.q,np:null,t:G.turn,full:true}):K[id]};
 const grp=id=>{const k=live(id);return k.np?998:k.o!=null&&k.o>=0?k.o:999}; /* you, then each rival, then minor powers, then planes no one holds */
 const grpName=g=>g===0?"You":g===998?"Minor Powers":g===999?"Held by no one":G.players[g].name;
 const rows=Object.keys(K).filter(id=>K[id].full).sort((a,b)=>grp(a)-grp(b)||idCmp(a,b));
 const gcount={};rows.forEach(id=>{const g=grp(id);gcount[g]=(gcount[g]||0)+1});let lastG=null;
 const lastMine=rows.filter(id=>grp(id)===0).pop();
 const mineTotal=ownedPlanes(0).reduce((a,p)=>a+yieldNow(p),0),mineMax=ownedPlanes(0).reduce((a,p)=>a+maxNow(p),0);
 h+=`<div class="sec card"><h3>Known planes</h3><div class="scroll"><table class="kp"><tr><th>Plane</th><th>Holder</th>${icTh("dom")}${icTh("val")}${icTh("soul")}${icTh("hor")}${icTh("sh")}${icTh("pl")}<th>Seen</th></tr>${rows.map(id=>{const k=live(id),mine=k.o===0,g=grp(id),gh=g!==lastG?`<tr class="grp"><td colspan="9">${grpName(g)} · ${gcount[g]} plane${gcount[g]>1?"s":""}</td></tr>`:"";lastG=g;const v=rowVals(id),pv=G.prev&&G.prev[id],dd=key=>pv&&v&&pv[key]!=null&&v[key]!=null?dsm(v[key]-pv[key],mine):"";return`${gh}<tr class="click rc" style="--rc:${colOf(k.o,k.np)||"var(--cf)"}" data-act="plane" data-id="${id}"><td>${id}</td><td>${k.np?"Minor Power":k.o!=null&&k.o>=0?(mine?"You":short(k.o)):"–"}</td><td class="r">${k.d}${dd("d")}</td><td class="r">${k.q}${dd("q")}</td><td class="r">${mine?`${fmt0(yieldNow(G.planes[id]))} of ${fmt0(maxNow(G.planes[id]))}`:`<span style="color:var(--dim)">up to ${fmt0(QV(k.q))}</span>`}${dd("y")}</td><td class="r">${hordeOf(id,k)}${dd("hz")}</td><td class="r">${shadowOf(id,k)}${dd("sh")}</td><td class="r">${planarOf(id,k)}${dd("pd")}</td><td>${ageLabel(k.t)}</td></tr>${g===0&&id===lastMine?`<tr><td colspan="4"><b>Your planes produce</b></td><td class="r"><b>${fmt0(mineTotal)} of ${fmt0(mineMax)}</b></td><td colspan="4"></td></tr>`:""}`}).join("")}</table></div><div class="ickey">${["dom","val","soul","hor","sh","pl"].map(k=>`<span ${tipA(k)}>${icn(k,15)}<b>${icL[k]}</b></span>`).join("")}</div><p class="note">Row colors match the map: green is you, the rival colors are your rivals, grey-brown is a Minor Power (select its plane to see its name and what you know), and plain grey is a plane no one holds. Planes are grouped by holder and in letter order within each group. The sword (Domination Level) runs 0 to 6, and the gem (Value) is fixed for the game. Arrows show the change since last turn; no arrow means no change. Your own planes are always current. The flame (souls per turn) for planes you hold shows the total yield now out of the most the plane can give at full domination, both after your Chaos and Shadow Horde bonuses. Other planes show their best case before bonuses. The horned head (Horde Strength) is the strength of the hordes you last saw on the plane (a Minor Power's horde is its whole defense; ? means a horde there could not be read). The dashed violet head (Shadow Horde Strength) is the holder's public Shadow Horde strength that also defends the plane: all of it at their home plane, a third elsewhere. The shield (Planar Defense Strength) is the plane's own defense from its domination, offense plus defense. A prince's plane is defended by its Planar and Shadow values together. What you see for other planes is what you last saw and may be stale or low.</p></div>`;
 $("#main").innerHTML=h}

/* ===== STANDING ===== */
const VPH={"Carnage":"Souls value of enemy demons and populations destroyed. Counts double against Minor Powers.","Demons lost":"75% of the souls value of your own demons that die.","Horde strength":"The souls value of every demon you now command, the Shadow Horde included.","Planes dominated":"Each plane first taken: value × 3,000.","Planes held":"Domination × value × 1,000 for each plane you hold.","Chaos Power":"50,000 × your rank.","Souls consumed":"10% of souls spent, not souls banked."};
/* victory points are shown in three groups; older saved games used longer row names, so those are mapped to the new ones */
const VPG=[["Military",["Carnage","Demons lost","Horde strength"]],["Realm Size",["Planes dominated","Planes held"]],["Power & Economy",["Chaos Power","Souls consumed"]]];
const vpNorm=n=>({"Demons lost (75% of their soul cost)":"Demons lost","Souls consumed (10%)":"Souls consumed"})[n]||n;
const vpRow=(n,x)=>`<tr><td>${n}<div class="note">${VPH[n]||"15% on top of everything else."}</div></td><td class="r">${fmt0(x)}</td></tr>`;
function vpRows(v){const by={};v.parts.forEach(p=>by[vpNorm(p[0])]=p[1]);let h="";
 for(const [g,names] of VPG)h+=`<tr class="vpg"><td colspan="2" style="padding-top:12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut,#a89b92)"><b>${g}</b></td></tr>`+names.filter(n=>by[n]!=null).map(n=>vpRow(n,by[n])).join("");
 const rest=v.parts.filter(p=>!VPG.some(g=>g[1].includes(vpNorm(p[0]))));return h+rest.map(p=>vpRow(p[0],p[1])).join("")}
function chaosTable(){const me=G.players[0];return`<div class="scroll"><table><tr><th>Rank</th><th>Name</th><th class="r">Highest tier</th><th class="r">Yield bonus</th><th class="r">Cost to reach</th><th class="r">Invested to date</th><th class="r">Generals</th><th class="r">Points</th></tr>${RK.slice(1).map((r,i)=>{const n=i+1,you=n===me.rank;return`<tr style="${you?"background:var(--panel2);color:var(--gold)":""}"><td>${n}</td><td>${r.n}${you?" (you)":""}</td><td class="r">${r.t}</td><td class="r">+${Math.round(r.b*100)}%</td><td class="r">${r.c?fmt0(r.c):"–"}</td><td class="r">${!r.c?"–":n<=me.rank?`${fmt0(r.c)} (reached)`:n===me.rank+1?`${fmt0(me.foment)} (${Math.min(99,Math.floor(me.foment/r.c*100))}%)`:"0"}</td><td class="r">${r.g}</td><td class="r">${fmt0(n*50000)}</td></tr>`}).join("")}</table></div><p class="note">Cost is the souls you invest with FOMENT CHAOS to reach that rank. Your FOMENT CHAOS souls add up over the whole game and are never lost when you rise a rank, so each cost is a running total, not a fresh price. Invested to date shows each rank you have reached in full, your running total toward the next one, and nothing for the ranks beyond it. Yield bonus is the percentage added to what all your planes pay. Highest tier is the strongest demon you can summon: twice your rank, except rank 9 (tier 19) and rank 10 (tier 22). Fast demons hold the odd tiers and Heavy demons the even ones. Generals is the total you can control, Fast and Heavy together. Reaching rank 10 starts the end game and adds a 15% score bonus.</p>`}
function renderGameplay(){
  const st=[["Summon stage","SUMMON, SHADOW SUMMON and DISBAND are carried out for every prince. Souls are paid and the new demons join their horde or the Shadow Horde at once, so they fight this turn. Tiers come from the chaos power rank you held when the turn began. A disbanded horde is removed at once and refunds 10% of its cost. A horde cannot SUMMON while an enemy horde is on its plane at the start of the turn: no reinforcing in the middle of a fight."],
  ["Prince stage","Every Princely command is carried out, in the order you list them: FOMENT, UNLEASH GENERAL, SCRY, BLOOD PACT and BREAK PACT. A rank gained this turn only applies to your orders next turn: both the new summon tier and the higher general limit. The general limit for UNLEASH GENERAL is the one you had when the turn began, whatever order you list your commands in. A new general appears at once and can take orders from next turn. A Blood Pact forms only if both princes pay for it, and a betrayal denies it. When both stages are done, nothing another prince does with his hordes can undo a summon, a new general, a Foment or a Scry."],
  ["Movement","DOMINATE, MARCH and RAID orders are carried out. A Blood Pact forbids moving against a partner's plane. Hordes move one after another, but nobody can react to another prince's move, so hordes only meet where their orders leave them at the end of the move. Two enemy hordes that cross paths, or swap places, pass each other without fighting, so each may find the other's plane open. A horde stops when it enters a plane held by an enemy."],
  ["Fights",`<ol type="1" style="margin:6px 0 0;padding-left:24px;display:grid;gap:6px"><li><b>Fight Locations.</b> Fighting is resolved in the following location order:<ol type="a" style="margin:6px 0 0;padding-left:24px;display:grid;gap:6px"><li>Any fights on any home plane that its original prince still owns.</li><li>Other planes in a mysterious and inscrutable order.</li></ol></li><li><b>Fight Types.</b> Fight types are resolved in the following order on each plane:<ol type="a" style="margin:6px 0 0;padding-left:24px;display:grid;gap:6px"><li>Horde v Horde: multiple hordes belonging to the same player are combined into a single temporary horde for combat purposes.</li><li>Horde v Defenses.</li></ol></li><li><b>Main Fight Sequence.</b> Which hordes fight at any given step is determined by their general’s experience and age. If multiple hordes and generals belong to the same prince, the best experience and oldest age is used. If experience and age are tied, then other tie breakers will be used.<ol type="a" style="margin:6px 0 0;padding-left:24px;display:grid;gap:6px"><li>General scrum: enemies pair off and fight. A horde that is beaten withdraws. If a scrum fight is a draw, both hordes withdraw, unless one is at least twice as strong as the other and as everything else on the plane, in which case that horde stays. There may be no hordes left at the end of these fights!<ol type="i" style="margin:6px 0 0;padding-left:24px;display:grid;gap:6px"><li>If the plane is defended, hordes that belong to the plane owner join the defending horde and skip the general scrum. Hordes that belong to a prince that is a Blood Pact partner of the defending prince skip this step.</li><li>There will be only one horde, if any, that remains after the scrum, unless Blood Pact partners are present. These partners will not fight each other, nor will they fight as allies (combining their hordes), but will fight the enemy hordes separately until only the pact partners are left.</li></ol></li><li>If the plane is defended, the surviving enemy fights the horde that is in a Blood Pact with the defender (if any). A horde that is beaten, or reaches a draw, withdraws. An attack that does not break the defender is repulsed, even if the attacker was stronger. An attacker that wins goes on to the next step.</li><li>If the plane is defended, the surviving attacker, if any, fights the defending horde. A horde that is beaten, or reaches a draw, withdraws. Only a winner goes on to the next step.</li><li>If the plane is owned and has a domination level of 1 or more, the surviving enemy, if any, fights the planar defenses.<ol type="i" style="margin:6px 0 0;padding-left:24px;display:grid;gap:6px"><li>For Blood Pact partners, each takes a turn against the defenses unless one reduces the domination level to 0. In that case that partner takes the plane and all fighting stops.</li><li>NOTE: Hordes with the RAID command skip the planar defense step.</li></ol></li></ol></li><li><b>Withdrawal.</b> A horde that withdraws goes back to 1) where it came from, 2) a friendly plane (the best one nearby), or 3) an empty one. If it has nowhere to go, it is destroyed. A horde that has already withdrawn once this turn and loses again is destroyed.<ol type="a" style="margin:6px 0 0;padding-left:24px;display:grid;gap:6px"><li>For the purposes of withdrawal an “empty” plane means a plane with no enemy horde on it and not held by an enemy. A horde that didn’t move this turn (a defender) can’t go back to where it came from, so it goes to a friendly or empty plane.</li></ol></li></ol>`],
  ["Growth and harvest","Domination grows by one on planes that were not attacked, up to 6. Yield is paid into the Well, and every unspent soul is harvested: 3 return as 4 next turn, until your Well reaches 75,000 and the harvest shuts off."]];
  let h=`<h2>How to Play the Game</h2>`;
  h+=`<div class="card"><ol class="note" style="margin:0;padding-left:20px;display:grid;gap:16px">
  <li><b>Read the report.</b> Every turn starts on the Report tab. The number on the tab counts the items that need your attention.
  <ul style="margin:6px 0 0;padding-left:20px;display:grid;gap:6px"><li><b>The info cards</b> sit at the top: Well of Souls, Total Yield per turn, Planes held, Demons, Chaos rank and Standing. Each card shows where you are now <i>and</i> how much it changed since the start of the turn (▲ up, ▼ down).</li>
  <li><b>Needs your attention</b> lists what the game thinks you should deal with now: a horde with no demons, a plane you lost, an enemy horde within two hops of your planes, a free general slot, a Foment that is close to a new rank, a horde whose demons are turning unruly, and warnings that the end of the game is near. Each item has a button that takes you to the right tab.</li>
  <li><b>Battles and events</b> tells you what happened to your hordes and planes, and what you learned about your rivals. Select any battle outcome to <b>drill down</b> into the fight round by round, with losses on both sides and, potentially, the enemy generals.</li>
  <li><b>Your orders and what came of them</b> and <b>New intelligence</b> show how each order turned out and which planes you newly discovered. The buttons above the report (All, My orders, Battles &amp; events, Intel) filter it, and the menu lets you reread earlier turns.</li>
  <li><b>The header</b> at the top right always shows the Turn, your Well of Souls, your Total Yield per turn and the number of Planes you hold. <b>Move your mouse over any of them</b> for an explanation. The icons on the map and the column headings in the Known Planes table explain themselves the same way.</li></ul></li>
  <li><b>Review your Realm map.</b> After the report, open the Realm tab to see where you stand on the map.
  <ul style="margin:6px 0 0;padding-left:20px;display:grid;gap:6px"><li><b>Planar portals.</b> Hordes can move only through portals. Every plane has three: east, west, and one vertical portal that leads up or down. The map wraps at every edge, so the far left connects to the far right, and top to bottom. Red lines show the connections between planes, and a chasm gap shows where a vertical portal does not exist. One plane may not be reachable from another directly: you may need a route of several planes, and the longest trip between two planes is 8 portals. A plane's detail card ends with the list of its portals.</li>
  <li><b>The Abyss map.</b> Each square is a plane, with its code and the holder's color: a prince's planes glow in that prince's color, and Minor Powers have their own color. A square shows its Domination level and its Value, the hordes you have seen there (your own are green H tags; a prince's numbered circles take that prince's color; Minor Hordes show !), and a dashed outline means the information is stale or the plane is unexplored. The legend under the map explains the symbols.</li>
  <li><b>Plane detail cards.</b> Select a plane on the map to open its card. How much it shows depends on what you know. A plane you only know exists is "unexplored". A plane you have explored shows its name, holder, Domination, Value, the souls it yields, the strength of the hordes, Shadow Horde and planar defense you last saw, how old that information is, and its portals. Information is revealed by your free SCRY each turn (every plane next to your planes and hordes), by a paid SCRY (farther away), and by moving a horde there. The card also has buttons to send each of your hordes to DOMINATE, MARCH to or RAID it.</li>
  <li><b>The Known Planes table</b> lists every plane you have explored, grouped by holder: you first, then each rival, then Minor Powers, then planes no one holds. The icons at the top of the columns are Domination Level, Value, Souls per turn, Horde Strength, Shadow Horde Strength and Planar Defense Strength, and the Seen column tells you how fresh each row is. The small arrows show change since last turn. Select a row to open its card.</li></ul></li>
  <li><b>Give your orders.</b> Now open the Orders tab. There are two kinds of orders: <b>horde orders</b>, one for each horde, and <b>princely commands</b>, up to four per turn. Nothing happens until you resolve the turn, and multi-turn orders (Move and Dominate, Forced March) keep going on later turns until the horde arrives or you change them.
  <ol type="a" style="margin:8px 0 0;padding-left:22px;display:grid;gap:8px">
  <li><b>Horde cards.</b> Each card shows the general's name, the horde's number and where it is (select the plane code to see it on the map), then its class (Heavy or Fast), strength, movement, and number of demons, with the list of demons and how many were added or lost since last turn. Under that is the command menu (HOLD, DOMINATE, MARCH, RAID, SUMMON or DISBAND) with a description of what it does and the target or number of demons to choose. The <b>Details</b> button on a card <b>reveals</b> the general's Age, Experience, Resurrections and abilities (one ability at Age 10, another at Experience 10), and pressing it again <b>hides</b> them. Below the cards are two more buttons that work the same way: <b>Show the demon tables</b> (every demon's tier, cost, strength and purge, with the tiers you cannot summon yet greyed out) and <b>Show general abilities</b> (every ability and what it does). The Shadow Horde card sits beside your hordes.</li>
  <li><b>Princely commands.</b> You can give up to four each turn, and each one has its own cost and effect. <b>FOMENT CHAOS</b> invests souls toward your next Chaos rank, which unlocks higher tiers of demons, more generals, a bigger yield and victory points. <b>UNLEASH GENERAL</b> costs ${fmt0(UNLEASH)} souls and creates a new general for a new horde (an Assault Commander summons Heavy demons and moves 1 plane; a Maneuver Commander summons Fast demons and moves 3). <b>SCRY</b> looks beyond the free one-hop scry, for 2,500 souls per extra hop, and also reveals what demons the hordes it reaches are made of. <b>BLOOD PACT</b> costs more each turn of the game, lasts ${BONDLEN} turns and stops you and your partner fighting each other, and each of you earns income; a game-run prince answers only if it shows as open, and a human prince must order the pact too. <b>BREAK PACT</b> costs ${fmt0(BREAKC)} souls to end a pact early, at the price of betraying your partner. Every command takes effect when the turn resolves, and a rank you gain this turn applies to your orders next turn.</li>
  <li><b>Keep track of your souls.</b> The bar at the bottom of the Orders tab keeps a running total as you give orders: your Well, the cost of your horde commands, the cost of your princely commands, and what is <i>left after commands</i>, with a note on whether it will be harvested. Unspent souls are harvested (every 3 come back as 4 next turn, until your Well reaches ${fmt0(HARV_CAP)}). A summon shows its cost under the horde's command. Errors, such as spending more than you have, turn red and stop you resolving until they are fixed. The bar also holds the <b>Resolve turn</b> button.</li></ol></li>
  <li><b>Review your Standing.</b> Before you submit the turn, look at the Standing tab.
  <ul style="margin:6px 0 0;padding-left:20px;display:grid;gap:6px"><li><b>Your score.</b> The top line tells you what place you are in. Below it is your victory point total, split into each source (carnage, planes dominated, demons killed and lost, horde strength, Chaos Power, planes held and souls consumed), with what each one means. Rivals' totals stay hidden until the game ends, so watch what they do.</li>
  <li><b>How the game ends.</b> Shows each of the three conditions that start the end-game countdown, with your progress toward each: a prince reaching Chaos Lord (rank 6), nearly every plane having been dominated once, and every prince having met every other. Once one has happened, the page tells you in words how likely the game is to end next turn. The game also ends after turn ${MAXT}.</li>
  <li><b>The princes of the Abyss.</b> This card shows each rival's Chaos rank, whether it is in a Blood Pact with you, whether a game-run prince is open to one, its Danger Level (how aggressive it is) and its personality once you have discovered it. The three personalities, Craven and Spiteful, Vengeful and Flexible, are explained at the bottom of the card. It tells you who is dangerous, and who might make a good partner.</li>
  <li><b>The Chaos Power ranks table.</b> Every rank, with the highest demon tier, the yield bonus, the cost to reach it, how much you have invested, the number of generals it allows and the victory points it is worth. Your own rank is highlighted. It tells you what to Foment toward next.</li></ul></li>
  <li><b>Resolve the turn.</b> When your orders are ready, press <b>Resolve turn</b>. All princes act at once (see the Turn Sequence below), and a new report appears. Repeat until the game ends: after turn ${MAXT}, or sooner if an end-game countdown runs out.</li></ol></div>`;
  h+=`<h2 style="margin-top:22px">Tips for Your First Game</h2><div class="card"><ul class="note" style="margin:0;padding-left:20px;display:grid;gap:8px">
  <li><b>Spend your first Well.</b> You begin as a Chaos Soldier with ${fmt0(10000)} souls, one plane and one horde. Unspent souls only return four for every three you hold, and souls sitting in the Well score nothing, so put most of them into demons on turn 1.</li>
  <li><b>Look before you leap.</b> Your free SCRY already shows every plane next to your planes and hordes: its holder, its Domination and Value, and the hordes seen there. When you order a DOMINATE you are also shown what is known about the defenders.</li>
  <li><b>Weak targets first.</b> A plane no prince holds, or a Minor Power's plane, has no planar defense and is the easiest to take. Each plane you hold adds to your yield, and it takes a few turns for a new plane to reach full Domination.</li>
  <li><b>Points come from many places.</b> Planes, kills, horde strength, Chaos rank and souls spent all score. Check the Standing tab every turn: it shows where you rank and how the end game is going.</li>
  <li><b>Do not park your hordes.</b> A horde that sits among many demons, far from home, without fighting, gets restless (see Mindless Rage below). Keep them fighting, take them home, or order DISCIPLINE.</li>
  <li><b>Spend before the end.</b> Nobody is told exactly when the game will end. Souls left in your Well at the end score nothing.</li></ul></div>`;
  h+=`<h2 style="margin-top:22px">Souls and Your Well of Souls</h2><div class="card"><p class="note" style="margin-top:0">Souls are the money of the game. Your souls sit in your <b>Well of Souls</b>, aka your <b>Well</b>. Each plane you hold pays into the Well every turn: its Value gives it a base yield of 800 to 2,200 souls (800 plus 200 for each point of Value), multiplied by how firmly you hold it (0% at Domination 0, 10%, 30%, 60%, 80%, 90%, and 100% at Domination 6), by the yield bonus of your Chaos rank (up to +70%) and by the bonus your Shadow Horde adds (up to +50%). Your <b>Total Yield</b> is the sum of all of that, plus any income from a Blood Pact.</p>
  <p class="note">Souls pay for everything: SUMMON and SHADOW SUMMON, FOMENT CHAOS, UNLEASH GENERAL, SCRY, BLOOD PACT and BREAK PACT. Any souls you do not spend are <b>harvested</b>: every three you leave unspent returns four next turn, until your Well holds ${fmt0(HARV_CAP)} souls. Disbanding a horde refunds a tenth of its cost. Souls you spend score victory points (a tenth of them), but souls you only bank do not.</p></div>`;
  h+=`<h2 style="margin-top:22px">Hordes, Generals and Demons</h2><div class="card"><ul class="note" style="margin:0;padding-left:20px;display:grid;gap:8px">
  <li><b>Demons</b> come in tiers, in two kinds. <b>Heavy</b> demons are the strongest for their cost and some carry a Purge rating, but they move only 1 plane a turn. <b>Fast</b> demons move 3 planes a turn, are weaker for their cost and cannot purge, and only Fast demons can join the Shadow Horde. A horde moves at the pace of its slowest demon, and entering a plane that you hold, or that a Blood Pact partner holds, costs only half a move. The highest tier you can summon rises with your Chaos rank, from tier 2 at Chaos Soldier to tier 22 at Prince of Demons.</li>
  <li><b>Generals</b> lead the hordes: every horde has one. Your Chaos rank limits how many generals you may command, from 2 at Chaos Soldier up to 14 at Prince of Demons, and UNLEASH GENERAL creates a new one. An Assault Commander leads a Heavy horde, and a Maneuver Commander leads a Fast one. A general earns an ability at Age 10 and another at Experience 10, and one who is destroyed and brought back to life loses them.</li>
  <li><b>Summoning</b> is the first thing done when a turn resolves: the demons join their horde at once and can fight this turn. A horde cannot SUMMON while an enemy horde is on its plane at the start of the turn.</li>
  <li><b>The Shadow Horde</b> is the army you keep at home. It is built with SHADOW SUMMON, it raises your yield by oppressing your planes, and a third of its strength joins the defense of every plane you hold (all of it at your home plane). Rivals can see how strong it is, but only a SCRY shows what is in it.</li></ul></div>`;
  h+=`<h2 style="margin-top:22px">Mindless Rage</h2><div class="card"><p class="note" style="margin-top:0">Demons are unruly. Pack many of them together without a fight, and they turn on each other. Each horde carries a hidden Mindless Rage. You never see its number, only its <b>stage</b>, which appears beside the horde on the Orders tab and in the report, with the likely cause.</p>
  <h3>What builds rage</h3><ul class="note" style="margin:0;padding-left:20px;display:grid;gap:8px">
  <li>More demons, and stronger ones, on the plane. All of your hordes on a plane count together, and the best general among them holds them back.</li>
  <li>Distance from home. Nothing happens on your home plane, and the farther a horde is from home the faster the rage builds.</li>
  <li>Turns without combat. A turn with a fight builds no rage, unless the horde was driven out of the plane or the fight was a draw.</li>
  <li>Some things cause a temporary flare for a couple of turns: a defeat or a draw, or sitting on a plane with a Blood Pact partner's horde. A plane you hold calms it, also for a short time.</li>
  <li>Veteran generals slow the rage down, but they never stop it.</li></ul>
  <h3>The stages</h3><ul class="note" style="margin:0;padding-left:20px;display:grid;gap:8px">
  <li><b>Discontent.</b> The demons squabble, and the horde does worse in the tactics of a fight, more so each turn.</li>
  <li><b>Rioting.</b> The horde starts to lose demons every turn, and the losses grow as the rioting goes on.</li>
  <li><b>Mutinous.</b> The horde may refuse your DOMINATE, RAID and DISBAND orders, more often as the mutiny goes on, and a FORCED MARCH moves it only one plane. Its rage also begins to build faster.</li>
  <li><b>Frothing Mad.</b> Each turn the horde may rebel against you. The general is killed (he returns at your home plane next turn, without an army), and the horde becomes a Rebel Power: it attacks the plane it is standing on and, if it wins, seizes it.</li></ul>
  <p class="note">Every stage keeps the penalties of the stages below it. The remedy is the <b>DISCIPLINE</b> command. It sacrifices part of the horde (more of it the worse the mood), eases the rage and makes the general harder to defy for good. A horde that is Discontent or worse will obey it, though a mutinous horde may defy even that. Taking a horde home pauses the rage and its effects, but does not cure it, and a turn of fighting stops it growing. Rival princes run by the game suffer from rage just as you do.</p></div>`;
  h+=`<h2 style="margin-top:22px">Minor Powers and Rebels</h2><div class="card"><p class="note" style="margin-top:0">Some planes are held by <b>Minor Powers</b>, demons who serve no prince. A Minor Power's horde is its whole defense: it has no planar defense, so beating its horde breaks the plane, which anyone may then take. The carnage you cause against Minor Powers counts double. A <b>Rebel Power</b> is a Minor Power in all but name: a horde that rebelled against its prince. It behaves like any Minor Power, suffers no rage, and can be fought, and its plane taken, in the same way. Many of the Minor Powers you meet may once have been a prince's horde.</p></div>`;
  h+=`<h2 style="margin-top:22px">Blood Pacts</h2><div class="card"><p class="note" style="margin-top:0">A Blood Pact binds you to a prince you have met for ${BONDLEN} turns. You will not fight each other, and neither of you may take the other's planes, and each of you earns a third of what the pact cost, every turn. Only one prince can be King of Demons, so a pact is never a shared victory: a partner is a rival to beat, and you are scored against each other the whole time. A prince run by the game says each turn whether it is open to a pact. A human prince must order the pact too, or you lose the souls and are betrayed. BREAK PACT ends it early for a price, and your partner is told they were betrayed. The Standing tab lists every prince, whether it is open or closed to a pact, and its Danger Level and personality.</p></div>`;
  h+=`<h2 style="margin-top:22px">Planar Domination and Value</h2><div class="card"><p class="note" style="margin-top:0">Every plane has a value from 0 to 7 that sets how many souls it can yield. The value is fixed at the start and never changes. The map shows it as v1, v5 and so on, and the Known Planes list on the Realm tab shows the most a plane can yield.</p>
  <p class="note">Every plane also has a domination level from 0 to 6, which does change. The map shows it as d1, d5 and so on. When you conquer a plane, its domination is set to 1 (2 if the conquering general has the Dominator ability). A plane held by a prince that was not attacked gains 1 domination every turn, up to 6. A plane that is successfully attacked loses 2 domination (3 if the attacking general has the Siegebreaker ability), so it often takes several turns to conquer a plane.</p>
  <p class="note" style="margin-bottom:0">A prince's plane is defended by its domination: the higher the domination, the stronger its planar defense (for example 20 at domination 3 and 80 at domination 6). So as domination changes, so does the plane's defense.</p></div>`;
  h+=`<h2 style="margin-top:22px">Combat</h2><div class="card"><p class="note" style="margin-top:0">There are two kinds of combat: horde against horde, and horde against planar defenses. A horde can fight several times in one turn, and frequently does.</p>
  <h3>Horde against horde</h3>
  <p class="note">When two enemy hordes end their turn on the same plane they fight. Two princes in a Blood Pact are not enemies. Victory depends on a fair bit of luck (demons are chaotic, after all) and on the ratio of your strength to the enemy's. When you issue a DOMINATE order you are shown strength information and a very vague prediction of your chances. Remember that defenders get a bonus: 15% for defending, 25% for a horde that holds, and 25% for a general with the Trench Master ability.</p>
  <p class="note">A fight ends when six rounds have been fought, when a horde has suffered 60% losses, one round after a horde gets a disarray result, in the same round a horde gets a rout result, or when a Slippery general pulls his horde out because it is outnumbered 3 to 1.</p>
  <h3>Horde against planar defenses</h3>
  <p class="note">When your horde ends its turn on an enemy prince's plane with a domination level of 1 or more, it attacks the plane's defenses on behalf of its prince, whatever the horde's order. The exceptions are a horde on a RAID, which slips past the defenses, and a horde on the plane of a Blood Pact partner. Attacking a plane means fighting the planar defense PLUS part of the owner's Shadow Horde: a third of it, or all of it on the owner's starting plane. (The Shadow Horde is the force a prince summons with SHADOW SUMMON. It stays home and defends every plane the prince holds.) This fight is resolved like horde against horde combat above.</p>
  <p class="note">A Minor Power's plane has no planar defense. Its horde is its whole defense: destroy the horde and the plane is broken, open to anyone. It is usually dominated by the victor, unless the victor fled.</p>
  <p class="note" style="margin-bottom:0">A plane's defense is shown in the Known Planes list on the Realm tab as three columns: Horde (the hordes on the plane), Shadow (the owner's Shadow Horde that defends it) and Planar (from its domination). A prince's plane is defended by Planar plus Shadow. Each win over the planar defenses cuts domination by 2 (3 with Siegebreaker), and you must fight the planar defenses and the Shadow Horde again each turn until domination reaches 0 and the plane is yours.</p></div>`;
  h+=`<h2 style="margin-top:22px">Turn Sequence</h2><p class="sub">The order in which a turn is resolved. Every prince's orders are carried out together at each stage.</p>`;
  h+=`<div class="card"><ol class="note" style="margin:0;padding-left:20px;display:grid;gap:10px">${st.map(s=>`<li><b>${s[0]}.</b> ${s[1]}</li>`).join("")}</ol></div>`;
  $("#main").innerHTML=h}
function renderStanding(){
 const me=G.players[0],v=vp(0),ranks=G.players.map(p=>p.rank).sort((a,b)=>b-a),cr=1+ranks.filter(x=>x>me.rank).length;
 let h=`<h2>Degree of victory</h2><p class="sub">You are #${vpRank(0)} of ${G.players.length} on victory points. Rivals' totals stay hidden until the game ends.</p>`;
 h+=`<div class="grid cols2"><div class="card"><h3>Your victory points</h3><div class="scroll"><table>${vpRows(v)}<tr><td><b>Total</b></td><td class="r"><b>${fmt0(v.total)}</b></td></tr></table></div></div>`;
 h+=`<div class="card"><h3>How the game ends</h3>
 <p class="note" style="margin-top:0">The first of these to happen starts a countdown. Later triggers change nothing. A countdown is not a fixed number of turns. The game cannot end for the first several turns, then every turn carries a chance of ending it, and the chance rises until the end is certain. You are never told the exact chance. Each turn an omen tells you how likely the end is: unlikely but possible, not very likely, likely or very likely. The game also ends after turn ${MAXT}.</p>
 <div class="kv" style="display:grid;gap:10px">
 <div><b>A prince reaches Chaos Lord (rank 6): countdown averages ten turns</b><div class="bar-in"><i style="width:${Math.min(100,ranks[0]/6*100)}%"></i></div><span class="note">Highest Chaos rank: ${ranks[0]} of 6.</span></div>
 <div><b>Nearly every plane dominated once (97%): countdown averages fifteen turns</b><div class="bar-in"><i style="width:${Math.min(100,G.everDom.length/domNeed()*100)}%"></i></div><span class="note">${G.everDom.length} of ${domNeed()} planes needed (the map has ${NP}).</span></div>
 <div><b>Every prince meets every other: countdown averages fifteen turns</b><div class="bar-in"><i style="width:${G.players.reduce((a,p)=>a+p.met.length,0)/(G.players.length*(G.players.length-1))*100}%"></i></div><span class="note">You have met ${me.met.length} of ${G.players.length-1} rivals.</span></div></div>
 ${G.end?`<p class="cd" style="margin:12px 0 0">Triggered: ${G.end.reason}. ${endNote(G.turn)}</p>`:""}</div></div>`;
 h+=princesCard();
 h+=`<div class="sec"><h3>Chaos Power ranks</h3><div class="card">${chaosTable()}</div></div>`;
 h+=`<div class="sec"><h3>Rules at a glance</h3><div class="card"><details><summary>How a turn works</summary><p class="note">All princes give orders in secret. First every prince summons and disbands, then every prince carries out Princely commands, then hordes move, then they fight, then domination grows and yield is paid into the Well. The Gameplay tab lists the stages in full.</p></details>
 <details><summary>How a fight works</summary><p class="note">A fight lasts up to six rounds. Each round the generals match wits, and the better plan helps its horde. The stronger horde has an edge in the clash, and the winner of each round pushes the other back and keeps some momentum that carries into the next round. Both sides lose demons every round, and a round can end in a stalemate, a gain, disarray or a rout. A horde that has lost most of its strength, falls into disarray or is routed breaks and retreats. A horde that attacks and does not break the defender is repulsed, even if it is the stronger. A horde that retreats goes back the way it came, or to a friendly plane nearby, or to an empty one; you do not choose. If a horde has nowhere to go it is destroyed. Two hordes that both moved into a plane meet in a meeting engagement, and only a broken horde retreats. Every demon destroyed scores its soul cost for the side that destroyed it. A demon with a purge rating also destroys some weaker enemy demons every round: see Purge below.</p></details>
 <details><summary>Purge</summary><p class="note">Some demons carry a purge rating. At the end of every round of a fight, each side's best purge rating destroys 20% of each kind of enemy demon whose tier is no higher than that rating, and never fewer than 1 of each kind present. The highest purge in the horde counts, and more purge demons do not stack. It fires whether that side is winning or losing, and the destroyed demons count as casualties. Purge also adds to the losses that can break a horde. ${DK.filter(k=>DT[k].purge).map(k=>`${DT[k].n} (purge ${DT[k].purge}) reaches ${DK.filter(j=>DT[j].t<=DT[k].purge).map(j=>DT[j].n).join(", ")}`).join("; ")}. Purge also reaches a prince's Shadow Horde: when a horde fights a prince's planar defenses, its purge destroys 20% of each kind of Shadow Horde demon within its reach, and never fewer than 1 of each kind present. All of the Shadow Horde defends the prince's home plane and a third of it defends any other plane, and the purge is scaled to match. A plane's own defense never purges.</p></details>
 <details><summary>Rival princes: danger and personality</summary><p class="note">Each rival prince run by the game has a Danger level: Strong Verbal Harassment and a Slap, A Kick in the Teeth and a Knee to the Groin, or Armageddon Made Manifest. You can choose it for each rival when a game begins; the middle level is the default. How the prince plays to reach that level stays hidden. About a third of the princes run by the game have a personality for the first 20 turns: Craven and Spiteful or Vengeful. A Craven and Spiteful prince attacks no prince who has not attacked it, and the other game-run princes leave it alone. A Vengeful prince keeps the same peace, but a prince who attacks it is hunted hard until turn 20. An attack is a DOMINATE, MARCH or RAID that ends on a plane the prince owns; fights over minor or unowned planes, or a Blood Pact partner's plane, do not count. Everyone else plays normally, and every personality ends after turn 20. A prince's personality is hidden until one of its planes lies in your SCRY reach, which includes any plane next to your own.</p></details>
 <details><summary>Prototype assumptions</summary><p class="note">Every demon is Fast or Heavy. Fast demons move 3 planes a turn and give less strength per soul; Heavy demons move 1 plane a turn and give more. In the first three rounds of a fight, a force made only of Fast demons adds 3 to its tactics roll against a force made only of Heavy demons. A horde moves at the pace of its slowest demon. Planes you hold cost half a move to cross. A general is Fast or Heavy and can only summon demons of its class. The Shadow Horde adds a third of its strength to the defense of every plane you hold, all of it at home. A Shadow Horde's strength is public, so it is part of the defense shown on a prince's planes and in the odds; only a SCRY shows which demons it holds. Plane quality odds are treated as weights because the deck's table adds to 110%.</p></details></div></div>`;
 h+=`<div class="sec"><h3>Result code</h3><p class="note">A result code is a short block of text that records how your game went: the final or current standings, how every prince scored, and the orders you gave each turn. Send it to whoever you want to see your game.</p><div class="tools"><button class="btn" data-mp="rescode">Make my result code</button><button class="btn" data-mp="resbox">Read a result code</button></div></div>`;
 h+=`<div class="sec"><h3>Save code</h3><p class="note">A save code holds your whole game, so you can carry on from this exact moment if your browser ever loses it (browsers sometimes do, especially on phones and tablets, and after the game is updated). Copy one now and then and keep it somewhere safe.</p><div class="tools"><button class="btn" data-mp="savecode">Make my save code</button><button class="btn" data-mp="savebox">Restore a saved game</button>${typeof olBtns==="function"?olBtns():""}</div></div>`;
 h+=`<div class="sec"><button class="btn" data-act="newgame">${UI.confirmNew?"Click again to abandon this game":"Start a new game"}</button></div>`;
 $("#main").innerHTML=h}

/* ===== GAME OVER ===== */
function showOver(){
 const o=$("#over");if(UI.hideOver){o.hidden=true;return}
 const sc=G.players.map((p,i)=>({i,v:vp(i)})).sort((a,b)=>b.v.total-a.v.total),w=sc[0],mg=sc[1]?Math.round((w.v.total/sc[1].v.total-1)*100):0;
 const deg=mg>=50?"Crushing":mg>=20?"Decisive":mg>=5?"Narrow":"Photo finish";
 o.hidden=false;
 o.innerHTML=`<div class="box"><h2 style="font-size:40px;color:var(--ember)">${w.i===0?"You are King of Demons":`${G.players[w.i].name} is King of Demons`}</h2><p class="sub">Game No. ${G.no}. ${deg} victory: ${mg}% ahead of second place after ${G.turn-1} turns.</p>
 <div class="card"><table><tr><th>#</th><th>Prince</th><th class="r">Points</th><th class="r">Chaos</th><th class="r">Planes</th></tr>${sc.map((x,k)=>`<tr><td>${k+1}</td><td style="color:var(--c${x.i})">${G.players[x.i].name}</td><td class="r">${fmt0(x.v.total)}</td><td class="r">${G.players[x.i].rank}</td><td class="r">${ownedPlanes(x.i).length}</td></tr>`).join("")}</table></div>
 <div class="tools" style="margin-top:14px"><button class="btn pri" data-act="playagain">Play again</button><button class="btn" data-mp="rescode">Result code</button><button class="btn" data-act="closeover">Review the final report</button></div></div>`}

/* ===== EVENTS ===== */
function renderAll(){renderHeader();({report:renderReport,orders:renderOrders,realm:renderRealm,standing:renderStanding,tutorials:renderTutorials,gameplay:renderGameplay})[UI.tab]();if(G.over)showOver();else $("#over").hidden=true}
function doResolve(){if(G.over)return;resolveTurn();UI.rep=null;UI.tab="report";UI.filter="all";UI.hideOver=false;save();renderAll();window.scrollTo(0,0)}
function act(t){const d=t.dataset,P=G.players[0];
 switch(d.act){
  case"tab":UI.tab=d.id;(G.seenTabs=G.seenTabs||{})[d.id]=true;save();if(d.plane)UI.sel=d.plane;renderAll();window.scrollTo(0,0);break;
  case"plane":UI.sel=d.id;UI.tab="realm";renderAll();{const el=$("#pdetail");if(el&&t.closest("svg")===null)window.scrollTo(0,0)}break;
  case"horde":UI.tab="orders";renderAll();setTimeout(()=>{const el=document.getElementById("hc-"+d.id);if(el)el.scrollIntoView({block:"center"})},0);break;
  case"filter":UI.filter=d.id;renderAll();break;
  case"pdf":exportPdf();break;
  case"battle":UI.open[d.k]=!UI.open[d.k];renderReport();break;
  case"gdet":{UI.open["gd"+d.id]=!UI.open["gd"+d.id];const y=window.scrollY;({report:renderReport,orders:renderOrders,realm:renderRealm,standing:renderStanding})[UI.tab]();window.scrollTo(0,y);break}

async function olResolve(why){if(OL.arun||!G||!G.ol||!G.mpg||G.over)return;OL.arun=1;
 try{const missing=humanSeats().filter(x=>!G.players[x].elim&&!(G.got||{})[x]);
  for(const x of missing){aiPlan(x);G.players[x].autoNote=true}
  resolveTurn();G.got={};G.sent={};G.ol.at={};GMX.mail=null;if(G.ol.dl)G.ol.due=olNextDue(G.ol.dl);else G.ol.due=null;save();
  let msg=`Turn ${G.turn-1} resolved (${why}).${missing.length?` An NPC played for ${missing.map(x=>G.players[x].name).join(", ")}.`:""}`;
  try{await olPublish();msg+=` Turn ${G.turn} is published.`}catch(er){GMX.msgs=[{t:msg+` But publishing failed: ${er.message} Press "Publish this turn again".`,bad:1}];if(MODE==="gm"&&!$("#mpmodal"))renderGM();return}
  GMX.msgs=[{t:msg}];olResult();if(MODE==="gm"&&!$("#mpmodal"))renderGM()}
 catch(er){GMX.msgs=[{t:"Could not resolve the turn: "+er.message,bad:1}]}finally{OL.arun=0}}

 h+=`<div class="card"><h3>3 · Resolve</h3><p class="note">${miss.length?`Still missing: ${miss.map(s=>esc(G.players[s].name)).join(", ")}${G.ol?"; an NPC will play for them":""}.`:"All human princes have sent orders."}</p><div class="row"><button class="btn pri" data-mp="resolve"${G.over?" disabled":""}>${GMX.confirm?"Click again to resolve":`Resolve turn ${T}`}</button></div>${G.over?`<div class="msg">The game is over.</div>`:""}</div>`;

 if(a==="start"){const s=suRead();

 else if(a==="cpall"){copyText(GMX.mail.map(m=>`===== To: ${m.to||"(no email)"} =====\nSubject: ${m.subject}\n\n${m.body}`).join("\n\n"),t)}
 else if(a==="sent"){const m=GMX.mail[+d.i];G.sent=G.sent||{};G.sent[m.s]=!G.sent[m.s];save();renderGM()}
